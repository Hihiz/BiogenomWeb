<h1>Детали витамина: {{ vitaminId }}</h1>

<p *ngIf="!detailVitamin$.value">Витамин не найден !</p>

<table
  *ngIf="detailVitamin$.value"
  class="table table-sm table-striped table-bordered m-2"
>
  <thead>
    <tr>
      <th>Id</th>
      <th>Название</th>
      <th>Действие</th>     
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>{{ detailVitamin$.value.id }}</td>
      <td>{{ detailVitamin$.value.title }}</td>
      <td>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary" 
                (click)="onUpdateVitamin(vitaminId)">
                <i class="bi bi-pencil"></i> Редактировать
            </button>

            <button class="btn btn-sm btn-outline-danger" 
                (click)="onRemoveVitaminAsync(vitaminId)">
                <i class="bi bi-trash"></i> Удалить
            </button>      
        </div>
      </td>
    </tr>
  </tbody>
</table>

<br />
<a class="btn btn-success" (click)="onGetVitamins()">Назад</a>
